<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Lifetide — a life simulation from birth to old age, played through mini-games. Ehtiyars Game.">
  <meta name="author" content="Ehtiyars Game">
  <title>Lifetide</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preload" href="fonts/Nunito-800.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="brand/ehtiyars-brand.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>
  <div id="eg-intro" class="eg-intro">
    <div class="eg-studio">
      <img class="eg-mark" src="brand/ehtiyars-mark.svg" alt="">
      <img class="eg-word" src="brand/ehtiyars-wordmark.svg" alt="Ehtiyars Game">
      <div class="eg-sub" data-eg-sub>sunar</div>
    </div>
    <div class="eg-game">
      <img class="eg-icon" src="icons/icon.svg" alt="">
      <div class="eg-name">Lifetide</div>
      <div class="eg-tag" data-eg-tag>Bir ömür, binlerce karar</div>
    </div>
  </div>
  <script>
    // Oyunun adı her dilde "Lifetide"; yalnızca alt yazı dile göre değişir
    (function () {
      var l = null; try { l = localStorage.getItem('hayatyolu.lang'); } catch (e) {}
      l = l || (navigator.language || 'en').slice(0, 2).toLowerCase();
      if (l === 'tr') return;
      document.documentElement.lang = 'en';
      document.title = 'Lifetide';
      var q = function (c) { return document.querySelector(c); };
      q('[data-eg-tag]').textContent = 'One life, a thousand choices';
      q('[data-eg-sub]').textContent = 'presents';
    })();
  </script>
  <script src="brand/ehtiyars-intro.js"></script>
  <script src="brand/ehtiyars-cross-promo.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
