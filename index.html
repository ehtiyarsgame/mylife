<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Life Path (Hayat Yolu) — a life simulation from birth to old age, played through mini-games. Ehtiyars Game.">
  <meta name="author" content="Ehtiyars Game">
  <title>Hayat Yolu</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preload" href="fonts/Nunito-800.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>
  <div id="splash">
    <div class="intro-studio"><img src="icons/studio.svg" alt=""><img class="eg-word" src="icons/ehtiyars-wordmark.svg" alt="Ehtiyars Game"><div class="studio-sub">sunar</div></div>
    <div class="intro-game"><img src="icons/icon.svg" alt=""><div class="game-name">Hayat Yolu</div><div class="game-sub">Bir ömür, binlerce karar</div></div>
  </div>
  <script>
    // Oyun adı dile göre: Türkçede "Hayat Yolu", diğer dillerde "Life Path"
    (function () {
      var l = null; try { l = localStorage.getItem('hayatyolu.lang'); } catch (e) {}
      l = l || (navigator.language || 'en').slice(0, 2).toLowerCase();
      if (l === 'tr') return;
      document.documentElement.lang = 'en';
      document.title = 'Life Path';
      var q = function (c) { return document.querySelector(c); };
      q('.game-name').textContent = 'Life Path';
      q('.game-sub').textContent = 'One life, a thousand choices';
      q('.studio-sub').textContent = 'presents';
    })();
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
